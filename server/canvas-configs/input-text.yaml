#Beyond just the id, the id is also a weight to determine which images have layering priority
#As of right now, we only support "image" and "text" -- "video" is planned.
settings:
  gamma: 1.0
elements:
  "elem1":
    order: 1
    type: "image"
    filepath: "images/rainbow.png"
    location: [0, 0]
    size:
      width: 64
      height: 64
  "elem2":
    order: 2
    type: "text"
    font-size: 24
    font-path: "ttf/Lobster-Regular.ttf"
    text: "WHATS UP GUYS!!1"
    color: "#0025ff"
    location: [5,0]