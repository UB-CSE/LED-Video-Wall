settings:
  gamma: 1.05
elements:
  "elem1":
    order: 1
    type: "web-browser"
    url: "https://threejs.org/examples/webgl_interactive_cubes"
    location: [0, 0]
    framerate: 30
    size: # Size of the element on the video wall
      width: 64
      height: 40
    view-size: # Size at which the web page is rendered at internally, in the browser. Webpages are usually designed for large screens so make this much bigger than _size_.
      width: 1200
      height: 750
  "elem2":
    order: 2
    type: "web-browser"
    url: "https://buffalo.edu"
    location: [0, 40]
    framerate: 30
    size:
      width: 64
      height: 24
    view-size:
      width: 1200
      height: 450
    # rotation: 45
    cookies:
      - name: "ubCookieBannerAccepted" # When this cookie is set to true, buffalo.edu will not show the cookie popup in the bottom left corner of the page
        value: "true"
        domain: ".buffalo.edu"
        path: "/"

        # Other optional cookie parameters that can be set:

        # secure: false
        # httpOnly: false
        # sameSite: ""

      - name: "otherCookie"
        value: "value"
        domain: "example.com"
        path: "/"
